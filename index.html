      // Live Digital Clock & IST Date Engine
      const [timeState, setTimeState] = useState(() => calculateISTTime());

      function calculateISTTime() {
        const now = new Date();
        // Asia/Kolkata options
        const timeFormatter = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Asia/Kolkata',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true
        });

        const dateFormatter = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Asia/Kolkata',
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        const parts = timeFormatter.format(now);
        const dateStr = dateFormatter.format(now);

        // Calculate hours in IST for greeting
        const istHours = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' })).getHours();
        let greeting = 'Good Evening';
        if (istHours >= 4 && istHours < 12) greeting = 'Good Morning';
        else if (istHours >= 12 && istHours < 17) greeting = 'Good Afternoon';
        else if (istHours >= 17 && istHours < 22) greeting = 'Good Evening';
        else greeting = 'Good Night';

        return {
          timeStr: parts,
          dateStr: dateStr,
          greeting: greeting
        };
      }

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeState(calculateISTTime());
        }, 1000);
        return () => clearInterval(timer);

      const filteredRoutes = useMemo(() => {
        return routes.filter(route => {

          if (selectedCategory !== 'All' && route.category !== selectedCategory) {
            return false;

          if (statusFilter === 'Verified' && !route.isVerified) return false;

          if (statusFilter === 'On Time' && route.status !== 'On Time') return false;
          if (statusFilter === 'Delayed' && route.status !== 'Delayed') return false;

          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const matchNumber = route.routeNumber.toLowerCase().includes(q);
            const matchName = route.routeName.toLowerCase().includes(q);
            const matchSource = route.source.toLowerCase().includes(q);
            const matchDest = route.destination.toLowerCase().includes(q);
            const matchStops = route.intermediateStops.some(s => s.toLowerCase().includes(q));
            const matchBus = route.busNumber.toLowerCase().includes(q);
            const matchDriver = route.driverName.toLowerCase().includes(q);
            return matchNumber || matchName || matchSource || matchDest || matchStops || matchBus || matchDriver;
          }
          return true;
        });

      const getFilterStyle = () => {

        else if (theme.filterPreset === 'warm') filters += ' sepia(30%) saturate(140%) hue-rotate(-15deg)';
        else if (theme.filterPreset === 'cool') filters += ' hue-rotate(180deg) saturate(90%)';
        else if (theme.filterPreset === 'high-contrast') filters += ' contrast(160%) brightness(110%)';
        return filters;

              onSave={handleSaveRoute}
            />
          )}

          {/* CONFIRM DELETE DIALOG */}
          {routeToDelete && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-200 animate-in fade-in zoom-in-95 duration-150">

                    Confirm Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================
              SECTION 6: APPEARANCE & THEME CUSTOMIZATION MODAL
              ======================================================== */}
          {showAppearanceModal && (
            <AppearanceModal
              theme={theme}

              onClose={() => setShowAppearanceModal(false)}
            />
          )}

          {/* FIREBASE CONFIGURATION MODAL */}
          {showFirebaseModal && (
            <FirebaseConfigModal 
              onClose={() => setShowFirebaseModal(false)}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    // --- APPEARANCE & THEME MODAL COMPONENT ---
    function AppearanceModal({ theme, onUpdateTheme, onClose }) {
      const [localTheme, setLocalTheme] = useState({ ...theme });
      const [previewUrl, setPreviewUrl] = useState(theme.backgroundImageUrl);
      const fileInputRef = useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            setPreviewUrl(reader.result);
            setLocalTheme(prev => ({ ...prev, backgroundImageUrl: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handlePreset = (preset) => {
        setLocalTheme(prev => ({ ...prev, filterPreset: preset }));
      };

      const handleSave = () => {
        onUpdateTheme(localTheme);
        onClose();
      };

      const handleReset = () => {
        setLocalTheme(DEFAULT_THEME);
        setPreviewUrl(null);
      };

      const getPreviewFilter = () => {
        let f = `brightness(${localTheme.brightness}%) contrast(${localTheme.contrast}%) saturate(${localTheme.saturation}%) hue-rotate(${localTheme.hueRotate}deg)`;
        if (localTheme.filterPreset === 'grayscale') f += ' grayscale(100%)';
        else if (localTheme.filterPreset === 'vintage') f += ' sepia(70%) contrast(110%)';
        else if (localTheme.filterPreset === 'warm') f += ' sepia(30%) saturate(140%) hue-rotate(-15deg)';
        else if (localTheme.filterPreset === 'cool') f += ' hue-rotate(180deg) saturate(90%)';
        else if (localTheme.filterPreset === 'high-contrast') f += ' contrast(160%) brightness(110%)';
        return f;
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">

            <div className="p-6 bg-slate-900 text-white flex items-center justify-between">
              <div>
                <h3 className="text-xl font-bold">Appearance & Theme Customisation</h3>
                <p className="text-xs text-slate-400">Personalize dashboard background, image filters, and brand accent colour</p>

              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            {/* Content */}

                  <input
                    type="file"
                    ref={fileInputRef}
                    accept="image/*"
                    onChange={handleImageUpload}
                    className="hidden"
                  />
                  <button
                    onClick={() => fileInputRef.current.click()}
                    className="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-md transition-all flex items-center justify-center gap-2"
                  >
                    <Icons.Plus />
                    <span>Upload Image from Device</span>
                  </button>
                  {previewUrl && (
                    <button
                      onClick={() => {
                        setPreviewUrl(null);
                        setLocalTheme(prev => ({ ...prev, backgroundImageUrl: null }));
                      }}
                      className="px-3 py-2 text-xs font-semibold text-red-600 hover:underline"

                      Remove Image
                    </button>
                  )}
                </div>
              </div>

              {/* Live Preview Box */}
              {previewUrl && (
                <div className="space-y-2">
                  <div className="text-xs font-semibold text-slate-500 flex items-center justify-between">
                    <span>Live Filter & Positioning Preview</span>
                    <span className="font-mono text-[11px] text-red-600">Overlay: {localTheme.overlayOpacity}%</span>
                  </div>
                  <div className="h-44 rounded-2xl overflow-hidden relative border border-slate-300 shadow-inner bg-slate-900 flex items-center justify-center">

                    <div

              {/* Placement & Fit Controls */}

                <div>

              {/* Overlay Opacity Slider */}
              <div>
                <div className="flex justify-between text-xs font-bold text-slate-700 mb-1">

                  <span className="font-mono text-red-600">{localTheme.overlayOpacity}%</span>
                </div>
                <input
                  type="range"

                  onChange={(e) => setLocalTheme(prev => ({ ...prev, overlayOpacity: Number(e.target.value) }))}
                  className="w-full accent-red-600"
                />
              </div>

              {/* Adjustments: Brightness, Contrast, Saturation, Hue */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <div>
                  <div className="flex justify-between text-xs font-bold text-slate-700 mb-1">
                    <span>Brightness</span>
                    <span className="font-mono">{localTheme.brightness}%</span>
                  </div>
                  <input
                    type="range"
                    min="50"
                    max="150"
                    value={localTheme.brightness}
                    onChange={(e) => setLocalTheme(prev => ({ ...prev, brightness: Number(e.target.value) }))}
                    className="w-full accent-red-600"
                  />
                </div>
                <div>
                  <div className="flex justify-between text-xs font-bold text-slate-700 mb-1">
                    <span>Contrast</span>
                    <span className="font-mono">{localTheme.contrast}%</span>
                  </div>
                  <input
                    type="range"
                    min="50"

                    value={localTheme.contrast}
                    onChange={(e) => setLocalTheme(prev => ({ ...prev, contrast: Number(e.target.value) }))}
                    className="w-full accent-red-600"

                <div>

                  <input
                    type="range"

                    max="360"

                  />

              </div>

              {/* Preset Filters */}
              <div>
                <label className="text-xs font-bold text-slate-700 block mb-2">Preset Photographic Filters</label>

                  {[
                    { id: 'none', label: 'Original' },
                    { id: 'grayscale', label: 'B&W Grayscale' },
                    { id: 'vintage', label: 'Vintage Sepia' },
                    { id: 'warm', label: 'Warm Sunlight' },
                    { id: 'cool', label: 'Cool Cyan' },
                    { id: 'high-contrast', label: 'High Contrast' },
                  ].map(f => (
                    <button
                      key={f.id}
                      onClick={() => handlePreset(f.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all ${
                        localTheme.filterPreset === f.id

                    >
                      {f.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Accent Color Selection */}
              <div>
                <label className="text-xs font-bold text-slate-700 block mb-2">Website Accent Colour</label>
                <div className="flex items-center gap-3">
                  {[
                    { color: '#dc2626', name: 'Classic Crimson Red' },
                    { color: '#e11d48', name: 'Ruby Rose' },
                    { color: '#991b1b', name: 'Bus Maroon' },
                    { color: '#d97706', name: 'Transport Amber' },
                    { color: '#1e40af', name: 'Deep Navy' },
                    { color: '#059669', name: 'Forest Emerald' },

                    <button
                      key={c.color}

    function RouteFormModal({ route, onClose, onSave }) {
      const [formData, setFormData] = useState({
        routeNumber: route?.routeNumber || '',
        routeName: route?.routeName || '',
        source: route?.source || '',
        destination: route?.destination || '',
        category: route?.category || 'City Express',
        intermediateStops: route?.intermediateStops ? route.intermediateStops.join(', ') : '',
        morningTiming: route?.morningTiming || '07:00 AM - 12:00 PM',
        eveningTiming: route?.eveningTiming || '04:00 PM - 09:30 PM',
        frequency: route?.frequency || 'Every 20 mins',
        busNumber: route?.busNumber || 'DL-01-AB-0000',
        driverName: route?.driverName || '',
        driverPhone: route?.driverPhone || '+91 98000 00000',
        capacity: route?.capacity || 50,
        currentOccupancy: route?.currentOccupancy || 'Medium',
        status: route?.status || 'On Time',
        isVerified: route ? route.isVerified : true,
        verificationNotes: route?.verificationNotes || '',
        fare: route?.fare || '₹20',
        totalDistanceKm: route?.totalDistanceKm || 15
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.routeNumber || !formData.routeName || !formData.source || !formData.destination) {
          alert('Please fill in Route Number, Name, Origin, and Destination.');
          return;
        }

        const stopsArray = formData.intermediateStops
          .split(',')
          .map(s => s.trim())
          .filter(s => s.length > 0);

        onSave({
          ...formData,
          intermediateStops: stopsArray.length > 0 ? stopsArray : [formData.source, formData.destination]
        });
      };

      return (

                      className="sr-only peer"
                    />
                    <div className="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                  </label>
                </div>
                {!formData.isVerified && (
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Audit Notes (What requires verification?)</label>
                    <input
                      type="text"
                      value={formData.verificationNotes}
                      onChange={(e) => setFormData({ ...formData, verificationNotes: e.target.value })}
                      placeholder="e.g. Faded intermediate stop name near Civil Lines on original board."
                      className="w-full p-2 rounded-lg border border-slate-200 text-xs"
                    />
                  </div>
                )}
              </div>

              {/* Submit Buttons */}
              <div className="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 font-bold hover:bg-slate-50"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold shadow-md shadow-red-600/30"
                >
                  Save Route Information
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- FIREBASE CREDENTIALS CONFIG MODAL ---
    function FirebaseConfigModal({ onClose, showToast }) {
      const [config, setConfig] = useState(() => {
        const stored = localStorage.getItem('smart_bus_firebase_config');
        return stored ? JSON.parse(stored) : {
          apiKey: '',
          authDomain: '',
          projectId: '',
          storageBucket: '',
          messagingSenderId: '',
          appId: ''
        };
      });

      const handleSave = (e) => {
        e.preventDefault();
        localStorage.setItem('smart_bus_firebase_config', JSON.stringify(config));
        showToast('Firebase configuration saved! Ready for Google Sign-in.');
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl relative animate-in fade-in zoom-in-95 duration-150 text-white">
            <div className="p-6 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <div>
                <h3 className="text-xl font-bold flex items-center gap-2">
                  <span>Firebase Credentials Setup</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-red-600/30 text-red-400 border border-red-500/30">Auth & Firestore</span>
                </h3>
                <p className="text-xs text-slate-400">Configure your Google Cloud Firebase project for persistent cloud auth</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <form onSubmit={handleSave} className="p-6 space-y-4 text-xs">
              <div className="p-3.5 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300 text-[11px] leading-relaxed">
                <span className="font-bold text-red-400">How to get these keys:</span>
                <ol className="list-decimal list-inside mt-1 space-y-0.5 text-slate-400">
                  <li>Visit <a href="https://console.firebase.google.com" target="_blank" className="text-red-400 underline">console.firebase.google.com</a> & create or select a project.</li>
                  <li>Enable <strong>Authentication → Google Sign-In</strong>.</li>
                  <li>Enable <strong>Cloud Firestore</strong> in test or production mode.</li>
                  <li>Project Settings → General → Web App (<code>&lt;/&gt;</code>) → Copy configuration snippet.</li>
                </ol>
              </div>

              <div>
                <label className="font-bold text-slate-300 block mb-1">API Key *</label>
                <input
                  type="text"
                  required
                  value={config.apiKey}
                  onChange={(e) => setConfig({ ...config, apiKey: e.target.value })}
                  placeholder="AIzaSy..."
                  className="w-full p-2.5 rounded-xl bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-red-500 font-mono text-white"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="font-bold text-slate-300 block mb-1">Auth Domain *</label>
                  <input
                    type="text"
                    required
                    value={config.authDomain}
                    onChange={(e) => setConfig({ ...config, authDomain: e.target.value })}
                    placeholder="your-project.firebaseapp.com"
                    className="w-full p-2.5 rounded-xl bg-slate-800 border border-slate-700 font-mono text-white"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-300 block mb-1">Project ID *</label>
                  <input
                    type="text"
                    required
                    value={config.projectId}
                    onChange={(e) => setConfig({ ...config, projectId: e.target.value })}
                    placeholder="your-project-id"
                    className="w-full p-2.5 rounded-xl bg-slate-800 border border-slate-700 font-mono text-white"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="font-bold text-slate-300 block mb-1">Storage Bucket</label>
                  <input
                    type="text"
                    value={config.storageBucket || ''}
                    onChange={(e) => setConfig({ ...config, storageBucket: e.target.value })}
                    placeholder="your-project.appspot.com"
                    className="w-full p-2.5 rounded-xl bg-slate-800 border border-slate-700 font-mono text-white"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-300 block mb-1">App ID</label>
                  <input
                    type="text"
                    value={config.appId || ''}
                    onChange={(e) => setConfig({ ...config, appId: e.target.value })}
                    placeholder="1:1234567890:web:abcdef..."
                    className="w-full p-2.5 rounded-xl bg-slate-800 border border-slate-700 font-mono text-white"
                  />
                </div>
              </div>

              <div className="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 font-bold"
                >
                  Close
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold shadow-md shadow-red-600/30"
                >
                  Save Configuration
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
